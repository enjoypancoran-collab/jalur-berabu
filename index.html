<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jalur Berabu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Lapis 2: peralihan layar, tombol, pintasan papan ketik. Dua panel
    berdampingan. Belum ada CSS cantik, belum ada gambar.
    Perlu server lokal (ES module + fetch):
      node tools/serve.mjs      lalu buka http://localhost:8000/
  -->
  <p id="status">Memuat content.json&hellip;</p>

  <!-- Layar judul -->
  <section id="layar-judul" class="layar" hidden>
    <h1 id="judul"></h1>
    <p id="subjudul"></p>
    <p id="peringatan-suara"></p>
    <button type="button" id="tombol-mulai"></button>
    <p>
      <button type="button" id="tombol-uji">Uji angka acuan</button>
    </p>
    <pre id="hasil-uji"></pre>
  </section>

  <!-- Tiga kartu pembuka -->
  <section id="layar-kartu" class="layar" hidden>
    <p id="kartu-nomor"></p>
    <p id="kartu-teks"></p>
    <p id="kartu-gambar" class="catatan-gambar"></p>
    <button type="button" id="tombol-kartu"></button>
  </section>

  <!-- Permainan: 14 keputusan bergantian -->
  <section id="layar-main" class="layar" hidden>
    <p id="kemajuan"></p>
    <div class="hud" id="hud"></div>
    <div class="panel-panel">
      <div class="panel" id="panel-cho">
        <h2 id="nama-cho"></h2>
        <div class="panel-isi" id="isi-cho"></div>
      </div>
      <div class="panel" id="panel-ones">
        <h2 id="nama-ones"></h2>
        <div class="panel-isi" id="isi-ones"></div>
      </div>
    </div>
    <p id="kenapa-catatan" hidden></p>
    <p id="bantuan-pintasan" class="catatan-gambar"></p>
  </section>

  <!-- Layar tiba -->
  <section id="layar-tiba" class="layar" hidden>
    <h2>Tiba</h2>
    <p id="tiba-teks"></p>
    <div class="hud" id="hud-tiba"></div>
    <button type="button" id="tombol-ulang"></button>
  </section>

  <script type="module" src="ui.js"></script>
</body>
</html>
